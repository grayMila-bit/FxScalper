<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0B1D3A"/>

  <!-- F: left monogram stroke -->
  <g stroke="#7FD4E8" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="27" y1="26" x2="27" y2="74"/>
    <line x1="27" y1="26" x2="42" y2="26"/>
    <line x1="27" y1="49" x2="39" y2="49"/>
  </g>

  <!-- T: right monogram stroke -->
  <g stroke="#7FD4E8" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="63" y1="26" x2="78" y2="26"/>
    <line x1="70.5" y1="26" x2="70.5" y2="74"/>
  </g>

  <!-- Candlestick: center, bridging the F and T -->
  <line x1="50" y1="18" x2="50" y2="34" stroke="#3FA66A" stroke-width="4" stroke-linecap="round"/>
  <rect x="42" y="34" width="16" height="32" rx="3" fill="#3FA66A"/>
  <line x1="50" y1="66" x2="50" y2="82" stroke="#3FA66A" stroke-width="4" stroke-linecap="round"/>
</svg>
